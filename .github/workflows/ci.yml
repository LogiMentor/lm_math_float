name: CI

on:
  push:
  pull_request:

jobs:
  repo-hygiene:
    name: Repository hygiene checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository hygiene checks
        run: python3 scripts/check_repo_hygiene.py --all-refs

  ghdl-regression:
    name: GHDL self-checking testbenches
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghdl

      - name: Run regression
        run: python3 scripts/run_ghdl_tests.py
