default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: public-sanity
        name: public release safety check
        entry: python scripts/check_public_sanity.py
        language: python
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: public-message-sanity
        name: public commit message safety check
        entry: python scripts/check_public_sanity.py --message-file
        language: python
        pass_filenames: true
        stages: [commit-msg]
