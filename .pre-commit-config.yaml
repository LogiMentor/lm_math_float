default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene check
        entry: python scripts/check_repo_hygiene.py
        language: python
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: repo-message-hygiene
        name: commit message hygiene check
        entry: python scripts/check_repo_hygiene.py --message-file
        language: python
        pass_filenames: true
        stages: [commit-msg]
